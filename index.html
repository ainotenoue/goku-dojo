<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Wild Word World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 明るい黄色のグラデーションの上に大きな白いパネル。分野ごとに色のちがう大きなカードを並べる。 */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --bg-top:#fff2cc;
  --ink:#22304a;
  --ink2:#66728a;
  --line:#ece5d3;
  --card:#ffffff;
  --soft:#fff6e3;
  --grid:#f0bd82;
  --accent:#e8590c;
  --accent2:#f98a3a;
  --accent-ink:#ffffff;
  --pen:#e0392d;
  --pen-soft:#fdeceb;
  --miss:var(--ok);
  --ok:#14966a;
  --ok-soft:#e5f6ee;
  --c-k:#d9561a;--c-g:#2766d1;--c-t:#6f43c0;--c-w:#13875f;--c-b:#d33a77;--c-y:#b86e00;
  --f-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","ヒラギノ角ゴ ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  --f-disp:var(--f-ui);
  --cs:clamp(40px,9.5vw,60px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 460px);
  background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #2766d1;outline-offset:2px}
#app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
small{font-size:12px;color:var(--ink2);letter-spacing:.04em}
h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}

/* マス目 */
.cells{display:flex;flex-wrap:wrap;padding:1px 0 0 1px}
.cell{
  width:var(--cs);height:var(--cs);display:grid;place-items:center;
  border:2px solid var(--grid);margin:0 -2px -2px 0;background:#fff;
  font-weight:700;font-size:calc(var(--cs)*.6);line-height:1;
}
.cell.blank{border:2.5px dashed var(--pen);background:var(--pen-soft);position:relative;z-index:1}
.cell.blank.filled{border-style:solid;color:var(--pen);animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}

/* ホーム: 見出し */
/* 見出し: 入試カウントは右上、タイトルは中央 */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.bwrap{position:absolute;top:0;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ver{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.04em;margin-right:8px}
.badge{display:inline-flex;align-items:baseline;gap:8px;background:#fff;border:2.5px solid #ff9a4d;color:#a8480f;font-weight:700;font-size:13px;border-radius:999px;padding:2px 16px}
.badge b{font-size:18px;color:var(--accent);font-weight:800}
.title{margin:0;font-family:'Trajan Pro','Trajan Pro 3',Trajan,'Cinzel','Times New Roman',Times,serif;font-size:clamp(28px,6vw,50px);font-weight:800;line-height:1.15;letter-spacing:.04em}
.lead{margin:0;font-weight:700;color:var(--ink2);font-size:clamp(13px,2.4vw,17px);letter-spacing:.06em}

.status{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.panel.zk{flex-direction:row;align-items:center;gap:10px;padding:8px 14px}
.zk .fz{flex:none;width:52px}
.zk .zt{min-width:0;flex:1}
.zk .zn{font-size:14px;font-weight:700;color:var(--ink)}
.zk .zc b{font-size:22px;color:var(--accent)}
.zk .zc small{font-size:12px;color:var(--ink2);font-weight:700}
.zk .bar{margin-top:3px}
.panel{background:#fff;border-radius:16px;padding:8px 16px;min-width:0;box-shadow:0 4px 18px rgba(120,90,30,.1);display:flex;flex-direction:column;gap:2px}
.l1{display:flex;align-items:baseline;gap:12px}
.l2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.l2 .bar{flex:1 1 90px;margin:0}
.panel b{font-size:20px;font-weight:800;line-height:1.4}
.bar{display:block;height:8px;background:#f1ead9;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent2);border-radius:4px}

.stage{background:#fff;border-radius:26px;padding:clamp(14px,3vw,24px);box-shadow:0 10px 36px rgba(120,90,30,.14);display:flex;flex-direction:column;gap:16px}
.stage h2.big{text-align:center;font-size:clamp(20px,3.6vw,28px);font-weight:800;color:var(--ink);letter-spacing:.02em}
.lab{font-size:14px;font-weight:700;color:var(--ink2);margin:0 0 8px}
.seg{display:flex;gap:10px}
.seg button{flex:1;min-height:50px;border:2px solid var(--line);background:#fff;border-radius:14px;font-weight:700}
.seg button[aria-pressed="true"]{background:#fff1df;color:#a8480f;border-color:#ff9a4d}

.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.card{
  grid-column:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;
  color:#fff;border:0;border-radius:20px;padding:14px 14px 12px;
  box-shadow:0 8px 18px rgba(30,30,60,.16);transition:transform .15s ease;
}
.card .hd{display:flex;align-items:center;justify-content:center;gap:10px;flex:1}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.g-k{background:linear-gradient(145deg,#ffa04d,#ee6420)}
.g-g{background:linear-gradient(145deg,#5a9cf5,#2766d1)}
.g-t{background:linear-gradient(145deg,#a67be2,#6f43c0)}
.g-w{background:linear-gradient(145deg,#3cc593,#13875f)}
.g-b{background:linear-gradient(145deg,#f77aa6,#d33a77)}
.g-y{background:linear-gradient(145deg,#f2b134,#cf7f0a)}
.fic{width:.95em;height:.95em;display:block}
.card .ic{font-size:40px;line-height:1.1;flex:none}
.card .nm{font-size:20px;font-weight:800;line-height:1.35;text-align:left}
.card .mm{width:100%;display:block;font-size:12px;font-weight:700}
.card .bar{background:rgba(255,255,255,.35);margin:0 0 4px}
.card .bar i{background:#fff}

.primary{
  background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);border:0;border-radius:18px;padding:16px 22px;
  font-weight:800;font-size:19px;min-height:56px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  box-shadow:0 6px 14px rgba(232,89,12,.28);
}
.ghost{
  background:#fff;border:2px dashed #e7c79a;border-radius:18px;padding:14px 18px;min-height:64px;width:100%;
  display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;text-align:left
}
.ghost:disabled{opacity:.55;cursor:default}
.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}
.tools .ghost{height:100%;padding:10px 14px;min-height:0;flex-wrap:wrap}
.tools .ghost .gl{gap:10px}
.tools .ghost small{font-size:11px;line-height:1.4;display:block;margin-top:2px}
.tools .seg{gap:6px}
.tools .seg button{padding:0 4px}
.gl{display:flex;align-items:center;gap:14px;min-width:0}
.nicon{width:56px;height:42px;flex:none}
.ghost b{color:var(--pen);font-size:22px;font-weight:800;white-space:nowrap}
.note{font-size:12px;color:var(--ink2);text-align:center;margin:0}

/* クイズ */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:46px;padding:0 16px;font-weight:700}
.pips{display:flex;gap:5px;flex:1;min-width:140px;flex-wrap:wrap}
.pips i{width:20px;height:20px;border:2px solid #ead9b8;background:#fff;display:block;border-radius:6px}
.pips i.ok{background:var(--ok);border-color:var(--ok)}
.pips i.ng{border-color:var(--pen);background:var(--pen-soft)}
.pips i.now{border-color:var(--ink)}
.chip{font-size:14px;font-weight:800;color:var(--accent)}
.qcard{position:relative;background:#fff;border-radius:26px;padding:clamp(18px,3.4vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 36px rgba(120,90,30,.14)}
.tag{align-self:flex-start;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--tc,var(--accent));border:2px solid var(--tc,var(--accent));border-radius:999px;padding:0 12px;background:#fff}
.ins{margin:0;color:var(--ink2);font-size:14px;line-height:1.6}
.body{font-weight:800;font-size:clamp(22px,4.6vw,30px);line-height:1.7;margin:0;text-wrap:balance}
.body .u{text-decoration:underline;text-decoration-color:var(--pen);text-decoration-thickness:3px;text-underline-offset:6px}
.body .blank{display:inline-block;min-width:3.6em;border-bottom:3px solid var(--ink);text-align:center;color:var(--pen);line-height:1.3;margin:0 4px}
.body .wd{font-size:clamp(28px,6vw,40px)}
.mean{margin:0;padding:10px 14px;background:var(--soft);border-radius:12px;font-size:15px}
.mean b{color:var(--accent)}
.choices{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{
  position:relative;display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 16px;text-align:left;
  background:#fff;border:2px solid var(--line);border-radius:16px;color:var(--ink);line-height:1.5;font-weight:500;
}
.choice:not(:disabled):hover{border-color:#ffa766}
.choice:not(:disabled):active{transform:scale(.99)}
.choice:disabled{cursor:default;color:var(--ink)}
.choice .mk{flex:none;width:32px;height:32px;border:2px solid #ead9b8;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink2)}
.choice .tx{min-width:0;overflow-wrap:anywhere}
.choices.two .choice .tx{font-weight:800;font-size:24px}
.choice.dim{opacity:.5}
.choice.right{background:var(--pen-soft);border-color:var(--pen)}
.choice.wrong{border:2px dashed var(--miss);opacity:.8}
.choice .bt{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:34px;line-height:1;color:var(--pen);font-weight:700;animation:pop .3s ease-out}
.maru{position:absolute;inset:-4px;border:4.5px solid var(--pen);border-radius:19px;pointer-events:none;clip-path:inset(-8px 100% -8px -8px);animation:draw .5s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes draw{to{clip-path:inset(-8px -8px -8px -8px)}}
.fb{border-top:2px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.fb .h{font-weight:900;font-size:28px;color:var(--pen);line-height:1.3}
.fb .h.ng{color:var(--ink);font-size:24px}
.fb .h.ng span{color:var(--pen)}
.fb p{margin:0}
.fb .done{font-weight:800;font-size:20px}
.fb .ex{color:var(--ink);font-size:15px}
.next{align-self:flex-end;min-width:210px;min-height:58px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);font-weight:800;font-size:18px;padding:0 26px;box-shadow:0 6px 14px rgba(232,89,12,.28)}

/* 結果・復習ノート */
.res{align-items:center;text-align:center;gap:14px}
.score{display:flex;align-items:baseline;justify-content:center;gap:10px;color:var(--pen);font-weight:900}
.score b{font-size:80px;line-height:1;border-bottom:5px double var(--pen);padding:0 8px 2px}
.score span{font-size:22px}
.msg{margin:0;font-weight:700;font-size:17px}
.res .pips{flex:none;justify-content:center;min-width:0}
.pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-flex;align-items:baseline;gap:6px;background:var(--soft);border-radius:999px;padding:2px 16px;font-weight:700;font-size:14px}
.pill b{color:var(--accent);font-size:18px;font-weight:800}
.up{width:100%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:18px;padding:12px 16px;font-weight:800;font-size:18px;box-shadow:0 6px 14px rgba(232,89,12,.28)}
.perfect{background:linear-gradient(145deg,#27a577,#0f7a56);color:#fff;border-radius:22px;padding:18px;text-align:center;font-weight:900;font-size:24px;box-shadow:0 8px 18px rgba(30,30,60,.16)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec h2{font-size:clamp(18px,3.2vw,22px);font-weight:800;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.miss{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.miss .tag{font-size:12px}
.miss .q{font-weight:800;font-size:19px;line-height:1.5}
.miss .hl{color:var(--pen)}
.miss .a{font-size:15px}
.miss .a b{color:var(--pen)}
.miss .e{font-size:14px;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>button{flex:1 1 200px}
.btn{min-height:58px;border-radius:18px;font-weight:800;font-size:17px;border:2px solid var(--ink);background:#fff;padding:0 20px}
.btn.fill{background:linear-gradient(135deg,var(--accent2),var(--accent));border:0;color:var(--accent-ink);box-shadow:0 6px 14px rgba(232,89,12,.28)}
.sticky{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.hero.sm .title{font-size:clamp(26px,5.6vw,40px)}
.empty{color:var(--ink);padding:28px 20px;text-align:center;border:2px dashed #e7c79a;border-radius:22px;background:#fff;font-weight:700;line-height:1.8}

/* 問題カードの上段: 左に分野と本文、右に〇・おしい！ */
.qtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.qmain{display:flex;flex-direction:column;gap:12px;min-width:0}
.trow{display:flex;align-items:center;gap:12px}
.prog{font-size:18px;font-weight:800;color:var(--ink2);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.slot{min-width:0;display:flex;justify-content:flex-end;align-items:flex-start;padding:4px 6px 0 0}
/* 「おしい！」はまちがいが続くほど大きくなる（1回目→3回目）。「正解！」は3段階目と同じ大きさ */
.oshii,.seikai{font-weight:900;color:var(--pen);line-height:1.2;white-space:nowrap;transform:rotate(-7deg);transform-origin:center;animation:shake .5s ease-out}
.oshii.l1{font-size:24px}
.oshii.l2{font-size:38px}
.oshii.l3,.seikai{font-size:54px}
/* 正解のときに中央へポンと出て、消えていく大きな〇 */
.bigmaru{position:absolute;left:50%;top:50%;height:min(120%,530px);aspect-ratio:1/1;z-index:5;pointer-events:none;opacity:0;transform:translate(-50%,-50%);animation:maru 2.1s ease-out forwards}
.bigmaru svg{width:100%;height:100%;display:block;overflow:visible}
.bigmaru circle{fill:none;stroke:var(--pen);stroke-width:3.6;opacity:.75}
@keyframes maru{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}11%{transform:translate(-50%,-50%) scale(1.08);opacity:1}17%{transform:translate(-50%,-50%) scale(1);opacity:1}79%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.05);opacity:0}}
/* 「正解！」はまっすぐ（安定）。ぽんと出て落ち着く */
.seikai{transform:none;animation:settle .45s ease-out}
@keyframes settle{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%{transform:rotate(-7deg) scale(.6);opacity:0}40%{transform:rotate(-12deg) scale(1.1);opacity:1}70%{transform:rotate(-4deg)}100%{transform:rotate(-7deg)}}

@media (max-width:560px){
  .status{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card,.card:nth-child(4){grid-column:span 1}
  .tools{gap:10px}
  .tools .ghost{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
  .tools .ghost .gl{flex-direction:column;align-items:flex-start;gap:4px}
  .tools .ghost small{display:none}
  .bwrap{position:static;align-self:flex-end;margin-bottom:4px}
  .card .nm{font-size:16px}
  .card .ic{font-size:32px}
  .card .hd{gap:6px}
  .choices.two .choice .tx{font-size:22px}
  .next{align-self:stretch}
  .oshii.l1{font-size:17px}
  .oshii.l2{font-size:26px}
  .oshii.l3,.seikai{font-size:36px}
  .bigmaru{height:min(100%,360px)}
  .score b{font-size:60px}
}
@media (prefers-reduced-motion:reduce){
  .maru{animation:none;clip-path:none}
  .oshii,.seikai{animation:none}
  .bigmaru{animation:none}
  .cell.blank.filled,.choice .bt{animation:none}
  .card{transition:none}
}
</style>

</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ===== 問題データ ===== */

// ことわざ・慣用句: [問題, 答え, ダミー3つ, 意味, 解説]
const K=[
['猿も□から落ちる','木',['山','枝','岩'],'その道の名人でも、失敗することがある','木登りが得意な猿でも、まちがえて木から落ちることがある。似た意味は「弘法にも筆の誤り」「河童の川流れ」。'],
['石の上にも□年','三',['五','十','百'],'つらくてもがまんして続ければ、いつか成功する','冷たい石の上でも三年すわり続ければ、あたたまるということ。'],
['立つ鳥あとを□さず','濁',['残','消','隠'],'去るときは、あとがみにくくならないよう始末をしておく','水鳥は飛び立ったあと、水をにごさない。「あとをにごす」と使う。'],
['花より□子','団',['菓','餅','食'],'見た目の美しさより、実際に役立つものを選ぶ','花見に行っても、花をながめるより団子を食べるほうがよい、ということ。'],
['二階から□薬','目',['口','耳','頭'],'思うようにいかず、もどかしい。効き目がうすい','二階から下にいる人に目薬をさそうとしても、うまくいかない。'],
['猫に□判','小',['大','金','銀'],'価値のわからない者に、よいものをあたえてもむだ','「小判」は昔の金貨。似た意味は「豚に真珠」「馬の耳に念仏」。'],
['弘法にも□の誤り','筆',['字','墨','書'],'名人でも、ときには失敗する','弘法大師（空海）は書の名人とされる。そんな人でも書きまちがえることがある。'],
['急がば□れ','回',['走','休','戻'],'急ぐときは、あぶない近道より安全な遠回りのほうが、かえって早い','「回れ」は「まわれ」と読む。急ぐ気持ちをおさえて、確実な道を選ぶことのたとえ。'],
['老いては□に従え','子',['親','孫','師'],'年をとったら、若い人の意見にも素直に従うのがよい','年をとったら、何でも自分で決めようとせず、子の意見にも従うほうがよいということ。'],
['寝耳に□','水',['風','雷','火'],'思いがけない知らせに、おどろく','ねている耳に水が入ったら、とびおきるほどおどろく。'],

const MARKS=['ア','イ','ウ','エ'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const sample=(a,n)=>shuffle(a).slice(0,n);
const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const RANKS=[[0,'ことばの見習い'],[100,'ことばの戦士'],[300,'ことばの勇者'],[600,'ことばの賢者'],[1000,'ことばの英雄'],[1600,'ことばの伝説']];
function rankOf(xp){let r=0;RANKS.forEach((x,i)=>{if(xp>=x[0])r=i;});return r;}
function daysLeft(){
  const now=new Date();const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((new Date(2027,1,1)-t0)/864e5);
}
const stat=id=>store.st[id];
const mastered=it=>{const s=stat(it.id);return !!(s&&s.r>=2&&!s.w);};
const inNote=it=>{const s=stat(it.id);return !!(s&&s.w);};

function weight(it){
  const s=stat(it.id);let w=1;
  if(!s||!s.s)w+=1.5;else{w+=(1-s.c/s.s)*2;if(s.r>=2)w-=0.6;}
  if(s&&s.w)w+=3;
  return Math.max(w,0.3);
}
function pickWeighted(pool,n){
  const arr=pool.map(it=>({it,w:weight(it)}));const out=[];
  while(out.length<n&&arr.length){
    const sum=arr.reduce((t,x)=>t+x.w,0);let r=Math.random()*sum,k=0;
    for(;k<arr.length;k++){r-=arr[k].w;if(r<=0)break;}
    if(k>=arr.length)k=arr.length-1;
    out.push(arr.splice(k,1)[0].it);
  }
  return out;
}
function makeQ(it){
  let d=it.d;
  if(it.type==='w'){
    const bad=CONFLICT[it.w]||[];
    d=sample(W.filter(x=>x[0]!==it.w&&bad.indexOf(x[0])<0).map(x=>x[1]),3);
  }
  if(it.type==='b'){
    d=sample(uniq(B.filter(x=>x[2]===it.sub&&x[1]!==it.a).map(x=>x[1])),3);
  }
  if(it.type==='y'){
    const grp=SYN.filter(g=>g.indexOf(it.a)>=0).reduce((x,g)=>x.concat(g),[]);
    const pool=Y.map(x=>x[0]).filter(x=>x!==it.a&&grp.indexOf(x)<0);
    const share=pool.filter(x=>Array.from(x).some(c=>it.a.indexOf(c)>=0));
    d=sample(share,Math.min(2,share.length));
    d=d.concat(sample(pool.filter(x=>d.indexOf(x)<0),3-d.length));
  }
  return {it,choices:shuffle([it.a].concat(d)),first:null,done:false,wrong:[],ok:false};
}

function cellsHTML(q,ans,a){
  return Array.from(q).map(ch=>ch==='□'
    ?'<span class="cell blank'+(ans?' filled':'')+'">'+(ans?esc(a):'')+'</span>'
    :'<span class="cell">'+esc(ch)+'</span>').join('');
}
function plainStem(it){
  if(it.type==='k')return it.q.replace('□','【'+it.a+'】');
  if(it.type==='g')return it.q.indexOf('（　）')>=0?it.q.replace('（　）','【'+it.a+'】'):it.q;
  if(it.type==='t')return '【'+it.w+'】'+it.s.replace(/[〔〕]/g,'');
  if(it.type==='w')return it.w;
  if(it.type==='y')return it.m;
  return '『'+it.t+'』';
}
function bodyHTML(q,ans){
  const it=q.it;
  if(it.type==='k')return '<div class="cells" role="img" aria-label="'+esc(it.q.replace('□','（　）'))+'">'+cellsHTML(it.q,ans,it.a)+'</div>';
  if(it.type==='g'){
    if(it.q.indexOf('（　）')<0)return '<p class="body">'+esc(it.q)+'</p>';
    const fill='<span class="blank">'+(ans?esc(it.a):'')+'</span>';
    return '<p class="body">'+esc(it.q).replace('（　）',fill)+'</p>';
  }
  if(it.type==='t'){
    const s=esc(it.s).replace('〔','<span class="u">').replace('〕','</span>');
    return '<p class="body">【'+esc(it.w)+'】　'+s+'</p>';
  }
  if(it.type==='w')return '<p class="body"><span class="wd">'+esc(it.w)+'</span></p>';
  if(it.type==='y')return '<p class="body">「'+esc(it.m)+'」\nにあてはまる四字熟語は？</p>'.replace('\n','<br>');
  return '<p class="body">『'+esc(it.t)+'』</p>';
}

const app=document.getElementById('app');
const state={screen:'home',round:null};
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function startRound(key){
  let pool;
  if(key==='review')pool=ITEMS.filter(inNote);
  else if(key==='all')pool=ITEMS;
  else pool=ITEMS.filter(i=>i.type===key);
  if(!pool.length)return;
  const n=Math.min(store.len,pool.length);
  state.round={key,qs:pickWeighted(pool,n).map(makeQ),i:0,score:0,streak:0,xp:0,rank0:rankOf(store.xp)};
  state.screen='quiz';
  render(true);
}
function choose(j){
  const R=state.round,q=R.qs[R.i];
  if(!q||q.done||q.wrong.indexOf(j)>=0)return;
  const ok=q.choices[j]===q.it.a;
  if(q.first===null){
    // 1回目の答えだけを成績にする
    q.first=ok;q.ok=ok;
    const s=store.st[q.it.id]||(store.st[q.it.id]={s:0,c:0,r:0,w:0});
    s.s++;
    if(ok){s.c++;s.r++;if(s.r>=2)s.w=0;}else{s.r=0;s.w=1;}
    const d=todayStr();if(store.day.d!==d)store.day={d:d,n:0,c:0};
    store.day.n++;if(ok)store.day.c++;
    if(ok){R.score++;R.streak++;const g=10+2*Math.min(R.streak-1,5);R.xp+=g;store.xp+=g;}else R.streak=0;
    save();
  }
  if(ok)q.done=true;else q.wrong.push(j);
  render(false);
}
function next(){
  const R=state.round;
  if(R.i+1>=R.qs.length){state.screen='result';render(true);}
  else{R.i++;render(true);}
}

/* ===== 画面 ===== */
function viewHome(){
  const dl=daysLeft();
  const r=rankOf(store.xp);const cur=RANKS[r][0];const nx=RANKS[r+1];
  const pct=nx?Math.round((store.xp-cur)/(nx[0]-cur)*100):100;
  const d=store.day.d===todayStr()?store.day:{n:0,c:0};
  const noteN=ITEMS.filter(inNote).length;
  const badge=dl>0?'<b>あと '+dl+' 日</b>':dl===0?'<b>今日が入試当日</b>':'入試おつかれさま';
  const best=RANKS[RANKS.length-1][1];
  const cards=ORDER.map(k=>{
    const pool=ITEMS.filter(i=>i.type===k);const m=pool.filter(mastered).length;
    return '<button class="card g-'+k+'" data-a="start" data-t="'+k+'">'+
      '<span class="hd"><span class="ic" aria-hidden="true">'+TYPES[k].ic+'</span><span class="nm">'+TYPES[k].name.replace('・','・<wbr>')+'</span></span>'+
      '<span class="mm"><span class="bar"><i style="width:'+Math.round(m/pool.length*100)+'%"></i></span>覚えた '+m+' / '+pool.length+'</span></button>';
  }).join('');
  const allM=ITEMS.filter(mastered).length;
  return '<header class="hero"><div class="bwrap"><span class="badge">'+badge+'</span><span class="ver">v1.0</span></div><h1 class="title">Wild Word World</h1>'+
      '<p class="lead">〜'+best+'を目指そう〜</p></header>'+
    '<section class="status">'+
      '<div class="panel"><div class="l1"><small>称号</small><b>'+RANKS[r][1]+'</b></div>'+
      '<div class="l2"><span class="bar"><i style="width:'+pct+'%"></i></span><small>'+(nx?'次の称号まで あと '+(nx[0]-store.xp)+' ポイント':'最高の称号です')+'</small></div></div>'+
      '<div class="panel zk">'+zukanIcon(r+1)+'<div class="zt"><div class="zn">ことば図鑑</div><div class="zc"><b>'+allM+'</b><small> / '+ITEMS.length+'</small></div><span class="bar"><i style="width:'+Math.round(allM/ITEMS.length*100)+'%"></i></span></div></div>'+
    '</section>'+
    '<section class="stage"><div class="cards">'+cards+'</div>'+
    '<button class="primary" data-a="start" data-t="all"><span>全分野に挑戦！</span><span aria-hidden="true">→</span></button>'+
    '<div class="tools"><div><p class="lab">1回の問題数</p><div class="seg">'+
      [5,10,20].map(n=>'<button data-a="len" data-n="'+n+'" aria-pressed="'+(store.len===n)+'">'+n+'問</button>').join('')+'</div></div>'+
    '<button class="ghost" data-a="notebook" '+(noteN?'':'disabled')+'><span class="gl">'+NOTE_ICON+'<span>復習ノート<br><small>つまづいた問題を攻略してパワーアップ！</small></span></span><b>'+noteN+'問</b></button></div>'+
    '</section>'+
    '<p class="note">進み具合は、この端末のブラウザに保存されます。</p>';
}

function viewQuiz(){
  const R=state.round,q=R.qs[R.i],it=q.it;
  const pips=R.qs.map((x,i)=>'<i class="'+(x.first!==null?(x.first?'ok':'ng'):(i===R.i?'now':''))+'"></i>').join('');
  const maxLen=Math.max.apply(null,q.choices.map(c=>Array.from(c).length));
  const two=maxLen<=6;
  const ch=q.choices.map((c,j)=>{
    let cls='choice',extra='',dis='';
    const bad=q.wrong.indexOf(j)>=0;
    if(q.done){
      dis=' disabled';
      if(c===it.a){cls+=' right';extra='<span class="maru"></span>';}
      else if(bad){cls+=' wrong';extra='<span class="bt" aria-hidden="true">×</span>';}
      else cls+=' dim';
    }else if(bad){cls+=' wrong';dis=' disabled';extra='<span class="bt" aria-hidden="true">×</span>';}
    return '<button class="'+cls+'" data-a="choose" data-i="'+j+'"'+dis+'><span class="mk">'+MARKS[j]+'</span><span class="tx">'+esc(c)+'</span>'+extra+'</button>';
  }).join('');
  let stamp='';
  if(q.done)stamp='<div class="seikai" role="status">正解！</div>';
  else if(q.wrong.length)stamp='<div class="oshii l'+Math.min(q.wrong.length,3)+'" role="status">おしい！</div>';
  const maru=q.done?'<div class="bigmaru" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42"/></svg></div>':'';
  let fb='';
  if(q.done){
    const last=R.i+1>=R.qs.length;
    const done=it.type==='k'?'<p class="done">'+esc(it.q.replace('□',it.a))+'</p>':'';
    fb='<div class="fb" id="fb" aria-live="polite">'+
      done+'<p class="ex">'+esc(it.e)+'</p>'+
      '<button class="next" data-a="next">'+(last?'結果を見る':'次へ')+'</button></div>';
  }
  const mean=it.type==='k'?'<p class="mean"><b>意味</b>　'+esc(it.m)+'</p>':'';
  return '<div class="qbar"><button class="back" data-a="home">もどる</button><div class="pips" aria-label="'+(R.i+1)+'問目 / '+R.qs.length+'問">'+pips+'</div>'+
    (R.streak>=2?'<span class="chip">れんぞく '+R.streak+'</span>':'')+'</div>'+
    '<article class="qcard">'+maru+'<div class="qtop"><div class="qmain">'+
    '<div class="trow"><span class="tag" style="--tc:var(--c-'+it.type+')">'+(R.key==='review'?'復習　':'')+TYPES[it.type].name+'</span>'+
    '<span class="prog" aria-hidden="true">'+(R.i+1)+'/'+R.qs.length+'</span></div>'+
    bodyHTML(q,q.done)+'</div><div class="slot">'+stamp+'</div></div>'+mean+
    '<div class="choices'+(two?' two':'')+'">'+ch+'</div>'+fb+'</article>';
}

function missRows(list){
  return '<ul class="list">'+list.map(it=>{
    const blank=it.type==='g'&&it.q.indexOf('（　）')>=0;
    let q=esc(plainStem(it));
    if(it.type==='k'||blank)q=q.replace(/【(.*?)】/,'<b class="hl">$1</b>');
    const a=it.type==='k'?'<span class="a">意味：'+esc(it.m)+'</span>':blank?'':'<span class="a">正解：<b>'+esc(it.a)+'</b></span>';
    return '<li class="miss"><span class="tag" style="--tc:var(--c-'+it.type+')">'+TYPES[it.type].name+'</span><span class="q">'+q+'</span>'+a+'<span class="e">'+esc(it.e)+'</span></li>';
  }).join('')+'</ul>';
}
function viewResult(){
  const R=state.round,n=R.qs.length,p=R.score/n;
  const msg=p>=0.9?'ほぼ完ぺきです。':p>=0.7?'いい調子です。':p>=0.5?'あと一歩です。まちがえた語句を見直しましょう。':'ここからが伸びどころです。まちがえた語句を、もう一度やってみましょう。';
  const miss=R.qs.filter(q=>!q.ok).map(q=>q.it);
  const r1=rankOf(store.xp);
  const up=r1>R.rank0?'<div class="up">称号が上がりました：'+RANKS[r1][1]+'</div>':'';
  const noteN=ITEMS.filter(inNote).length;
  const pips=R.qs.map(x=>'<i class="'+(x.ok?'ok':'ng')+'"></i>').join('');
  return '<div class="qbar"><button class="back" data-a="home">ホームへ</button></div>'+
    '<section class="stage res"><h2 class="big">結果発表！</h2>'+
    '<div class="score"><b>'+R.score+'</b><span>／ '+n+' 問正解</span></div>'+
    '<div class="pips" aria-hidden="true">'+pips+'</div>'+
    '<p class="msg">'+msg+'</p>'+
    '<div class="pills"><span class="pill">獲得 <b>+'+R.xp+'</b> ポイント</span><span class="pill">称号 <b>'+RANKS[r1][1]+'</b></span></div>'+up+'</section>'+
    (miss.length?'<section class="stage"><div class="sec"><h2>まちがえた語句　'+miss.length+'問</h2><small>復習ノートに入りました</small></div>'+missRows(miss)+'</section>':
      '<div class="perfect">全問正解です！</div>')+
    '<div class="row"><button class="btn fill" data-a="start" data-t="'+(R.key==='review'?'all':R.key)+'">もう一度</button>'+
    (noteN?'<button class="btn" data-a="review">復習ノートをやる（'+noteN+'問）</button>':'')+'</div>';
}
function viewNotebook(){
  const list=ITEMS.filter(inNote);
  return '<div class="qbar"><button class="back" data-a="home">ホームへ</button></div>'+
    '<header class="hero sm"><h1 class="title">復習ノート</h1><p class="lead">つまづいた問題を攻略してパワーアップ！</p></header>'+
    (list.length?'<section class="stage"><div class="sec"><h2>まちがえた語句　'+list.length+'問</h2></div>'+missRows(list)+'</section>'+
      '<div class="sticky"><button class="primary" data-a="review"><span>復習をはじめる（'+Math.min(list.length,store.len)+'問）</span><span aria-hidden="true">→</span></button></div>':
      '<div class="empty">復習する語句はありません。<br><small>問題をまちがえると、ここにたまります。</small></div>');
}

function render(top){
  app.innerHTML=state.screen==='home'?viewHome():state.screen==='quiz'?viewQuiz():state.screen==='result'?viewResult():viewNotebook();
  if(top){window.scrollTo(0,0);}
  else{const fb=document.getElementById('fb');if(fb)fb.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.getAttribute('data-a');
  if(a==='start')startRound(b.getAttribute('data-t'));
  else if(a==='choose')choose(+b.getAttribute('data-i'));
  else if(a==='next')next();
  else if(a==='home'){state.screen='home';render(true);}
  else if(a==='len'){store.len=+b.getAttribute('data-n');save();render(false);}
  else if(a==='notebook'){state.screen='notebook';render(true);}
  else if(a==='review')startRound('review');
});

render(true);
})();
</script>
</body>
</html>
